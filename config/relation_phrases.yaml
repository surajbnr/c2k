  - Who has X invested in?
  - What stakes does X hold?
  - Who invested in X?
  - Which startups does X back?
  authored_by:
  - Who wrote this paper?
  - Who are the authors of X?
  - Who authored X?
  - Which researchers wrote X?
  - Who is the author?
  affiliated_with:
  - Which university is X affiliated with?
