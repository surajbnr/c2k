arm: a2
model:
  provider: anthropic
  name: claude-haiku-4-5
  temperature: 0.0
chunking: {tokens: 900, overlap: 150, snap_window: 50}
extraction: {constrained: true, max_retries: 3, min_confidence: 0.0}
resolution:
  enabled: true
  embedding_model: BAAI/bge-base-en-v1.5
  top_k: 20
  tau_lo: 0.72        # tuned on tune split ONLY
  tau_hi: 0.88
  adjudication_batch: 20
evaluation:
  entity_match_threshold: 0.85
  span_iou_threshold: 0.5
  repeats: 3
  judge_sample: 100
paths: {pdfs: data/pdfs, gold: data/gold, db: data/db/c2k.sqlite}
