[project]
name = "c2k"
version = "0.1.0"
description = "Schema-constrained knowledge extraction with evidence-grounded provenance and gold-set evaluation."
requires-python = ">=3.11"
dependencies = [
    "instructor>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "anthropic<1",
    "ollama>=0.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rapidfuzz>=3.9",
    "pymupdf>=1.24",
    "networkx>=3.3",
    "scipy>=1.13",
    "typer>=0.12",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
]

[project.scripts]
c2k = "c2k.cli:app"

[dependency-groups]
dev = [
    "fastembed>=0.9.0",
    "pytest>=8.2",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c2k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# TestUnlock/TestSplitLocked are domain names from SPEC.md's I5 design, not
# pytest test classes.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
