# Held-out questions for judging how well a question is mapped to a relation.
# Written separately from the phrasings in config/relation_phrases.yaml and
# deliberately worded differently from them. `null` means "no relation": an
# off-topic or empty question that should get no answer rather than a guess.
# Small and hand-written, so treat accuracy on it as a rough guide.
